; M5Stack StickS3 vibration recorder.
; Flash: tremble.cmd upload
; The device buttons are intentionally unused. Recording starts from the website.

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0
board_build.embed_txtfiles =
    web/index.html
    web/app.css
    web/app.js
    web/dsp.js
    web/icon.svg
    web/logo.svg
    web/logo-text.svg
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
